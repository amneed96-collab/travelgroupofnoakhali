<script src="config.js"></script>

<script>
const params = new URLSearchParams(location.search);
const pkgIdentifier = params.get('pkg');
const SAVED_MOBILE_KEY = 'tg_booking_mobile';

let currentPackage = null;
let currentSeats = [];
let selectedSeats = []; // [{vehicleName, seatNo}]
let payMethods = [];    // এডমিনের "ব্যবস্থাপনা > ব্যাংকিং তথ্য" থেকে
let adminNames = null;

function parsePayMethods(settings) {
  try { const a = JSON.parse((settings && settings.paymentMethods) || '[]'); return Array.isArray(a) ? a : []; }
  catch (e) { return []; }
}

function applyPackageData(d, fromCache) {
  currentPackage = d.package;
  currentSeats = d.seats;
  if (!qs('#booking-form')) { render(); initResume(); return; }
  // ইতিমধ্যে ফরম দেখানো হচ্ছে: ব্যবহারকারীর নির্বাচন না মুছে শুধু সীটের অবস্থা হালনাগাদ
  selectedSeats = selectedSeats.filter(sel => currentSeats.some(s => s.vehicleName === sel.vehicleName && s.seatNo === sel.seatNo && s.status === 'available'));
  renderVehicles();
  qs('#seat-count').textContent = toBengaliNumber(selectedSeats.length);
  qs('#selected-seat-display').textContent = selectedSeats.length === 0 ? 'বামপাশ থেকে সীট বেছে নিন' : selectedSeats.map(s => `${s.vehicleName}-${s.seatNo}`).join(', ');
  qs('#fee-display').value = formatTaka(totalFee());
  const btn = qs('#submit-btn');
  btn.disabled = selectedSeats.length === 0;
  btn.textContent = selectedSeats.length === 0 ? 'সীট নির্বাচন করুন' : `বুকিং তথ্য জমা দিন (${toBengaliNumber(selectedSeats.length)}টি সীট)`;
}

async function init() {
  const content = qs('#page-content');
  if (!pkgIdentifier) {
    content.innerHTML = '<div class="empty-state">কোনো প্যাকেজ নির্বাচিত নেই। <a href="index.html">প্যাকেজ তালিকায় ফিরে যান</a></div>';
    return;
  }
  // পেমেন্ট মাধ্যম আলাদা কলে (ক্যাশ থাকলে সাথে সাথে), প্যাকেজ+সীট আগের ডেটা দেখিয়ে পরে হালনাগাদ
  apiGetSWR('getSettings', null, (res) => { if (res.ok) payMethods = parsePayMethods(res.data); }).catch(() => {});
  try {
    await apiGetSWR('getPackageFull', { id: pkgIdentifier }, (res, fromCache) => {
      if (!res.ok || !res.data || !res.data.package) { if (!fromCache) throw new Error('প্যাকেজ পাওয়া যায়নি'); return; }
      if (qs('#pay-form')) return; // পেমেন্ট ধাপে থাকলে ডিস্টার্ব করা হবে না
      applyPackageData(res.data, fromCache);
    });
  } catch (err) {
    content.innerHTML = '<div class="empty-state">লোড করতে সমস্যা: ' + err.message + '</div>';
  }
}

// ============================================================
// ধাপ ১: বুকিং তথ্য ও সীট নির্বাচন
// ============================================================

function render() {
  const content = qs('#page-content');
  const p = currentPackage;
  selectedSeats = [];

  content.innerHTML = `
    <div class="flex-between" style="margin-bottom: 20px;">
      <div>
        <span class="eyebrow" style="background:var(--cream-dark); color:var(--forest); border-color:var(--border);">🎫 বুকিং ফরম</span>
        <h1 style="margin:0;">${escapeHtml(p.spotName)}</h1>
        <p class="text-muted">${formatDate(p.startDate)} — ${formatDate(p.endDate)} · ${toBengaliNumber(p.totalDays)} দিন · ${formatTaka(p.delegateFee)}/জন</p>
      </div>
    </div>

    <div class="form-card resume-card">
      <strong>💳 আগে বুকিং দিয়েছেন কিন্তু পেমেন্ট বাকি?</strong>
      <div class="text-muted" style="font-size:0.85rem;">বুকিংয়ের মোবাইল নম্বর দিয়ে খুঁজে পেমেন্ট সম্পন্ন করুন।</div>
      <form id="resume-form">
        <input type="tel" name="mobile" placeholder="01XXXXXXXXX" pattern="[0-9]{11}" required>
        <button type="submit" class="btn btn-forest btn-sm">খুঁজুন</button>
      </form>
      <div id="resume-results"></div>
    </div>

    <div style="display:grid; grid-template-columns: 1.2fr 1fr; gap: 28px;" id="booking-grid">
      <div>
        <h3>🚌 গাড়ি ও সীট নির্বাচন করুন <span class="text-muted" style="font-weight:400; font-size:0.85rem;">(একাধিক সীট বাছাই করা যাবে)</span></h3>
        <div id="vehicle-list"></div>
      </div>
      <div>
        <h3>👤 বুকিং তথ্য</h3>
        <div class="form-card">
          <form id="booking-form">
            <div class="form-group"><label>নাম *</label><input type="text" name="name" required placeholder="আপনার পূর্ণ নাম"></div>
            <div class="form-group"><label>মোবাইল নম্বর *</label><input type="tel" name="mobile" required placeholder="01XXXXXXXXX" pattern="[0-9]{11}"></div>
            <div class="form-group"><label>ঠিকানা *</label><textarea name="address" rows="2" required placeholder="বর্তমান ঠিকানা"></textarea></div>
            <div class="form-group">
              <label>নির্বাচিত সীট সমূহ (<span id="seat-count">০</span>টি)</label>
              <div id="selected-seat-display" style="min-height:44px; background:var(--cream-dark); border-radius:9px; padding:10px 14px; font-weight:700; color:var(--forest);">বামপাশ থেকে সীট বেছে নিন</div>
            </div>
            <div class="form-group"><label>মোট ডেলিগেট ফি</label><input type="text" id="fee-display" readonly value="${formatTaka(0)}" style="background:var(--cream-dark); font-weight:700;"></div>
            <div class="hint" style="margin-bottom:14px;">বুকিং তথ্য জমা দেওয়ার পর পরের ধাপে পেমেন্ট করতে হবে।</div>
            <button type="submit" class="btn btn-primary btn-block" id="submit-btn" disabled>সীট নির্বাচন করুন</button>
          </form>
        </div>
      </div>
    </div>
  `;

  renderVehicles();
  qs('#booking-form').addEventListener('submit', submitBooking);
  qs('#resume-form').addEventListener('submit', (e) => { e.preventDefault(); searchResume(new FormData(e.target).get('mobile').trim(), true); });
  if (window.innerWidth < 860) qs('#booking-grid').style.gridTemplateColumns = '1fr';
}

function totalFee() { return currentPackage.delegateFee * selectedSeats.length; }

function renderVehicles() {
  const container = qs('#vehicle-list');
  const vehicles = currentPackage.vehicles || [];
  if (vehicles.length === 0) {
    container.innerHTML = '<div class="empty-state">এই প্যাকেজে কোনো গাড়ি যুক্ত করা হয়নি।</div>';
    return;
  }

  container.innerHTML = `
    <div class="seat-legend">
      <span><span class="legend-dot available"></span> খালি</span>
      <span><span class="legend-dot selected"></span> আপনার নির্বাচন</span>
      <span><span class="legend-dot held"></span> হোল্ড করা</span>
      <span><span class="legend-dot booked"></span> বুক হয়ে গেছে</span>
    </div>
  ` + vehicles.map(v => {
    const vSeats = currentSeats.filter(s => s.vehicleName === v.name);
    const availableCount = vSeats.filter(s => s.status === 'available').length;
    return `
      <div class="vehicle-block">
        <div class="vehicle-header">
          <span>${escapeHtml(v.name)} · ${escapeHtml(v.type || '')}</span>
          <span class="text-muted" style="font-weight:500; font-size:0.85rem;">${toBengaliNumber(availableCount)}/${toBengaliNumber(vSeats.length)} খালি</span>
        </div>
        <div class="seat-grid">${renderSeatRows(v.name, vSeats)}</div>
      </div>
    `;
  }).join('');

  qsa('.seat', container).forEach(el => {
    el.addEventListener('click', () => {
      if (el.classList.contains('seat-booked') || el.classList.contains('seat-held')) return;
      toggleSeat(el.dataset.vehicle, el.dataset.seat);
    });
  });
}

// সীটগুলোকে ৪টা করে সারিতে ভাগ করা (২+গ্যাপ+২), শেষে বিজোড় থাকলে শেষ সারিতে ৫টা
function renderSeatRows(vehicleName, vSeats) {
  const sorted = [...vSeats].sort((a, b) => a.seatNo.localeCompare(b.seatNo, undefined, { numeric: true }));
  const total = sorted.length;
  const remainder = total % 4;
  const rows = [];
  let i = 0;

  // যদি শেষে ১টা বিজোড় সীট বাঁচে, শেষ সারিতে ৫টা রাখা হবে (৪+১)
  const lastRowSize = remainder === 1 && total >= 5 ? 5 : (remainder === 0 ? 4 : remainder);

  while (i < total) {
    const remaining = total - i;
    const rowSize = remaining === remainder + 4 && remainder === 1 ? 4 : (remaining <= lastRowSize ? remaining : 4);
    const chunk = sorted.slice(i, i + (remaining === lastRowSize ? lastRowSize : 4));
    rows.push(chunk);
    i += chunk.length;
  }

  return rows.map(row => {
    if (row.length === 5) {
      // ৫ম (বাড়তি) সীটটি মাঝের গ্যাপ বরাবর, ৩নং সীটের ঠিক নিচে বসবে
      const firstPair = row.slice(0, 2);
      const restPair = row.slice(2, 4);
      const extraSeat = row[4];
      return `<div class="seat-row">
        <div class="seat-pair">${firstPair.map(s => renderSeat(vehicleName, s)).join('')}</div>
        <div class="aisle-gap aisle-gap-seat">${renderSeat(vehicleName, extraSeat)}</div>
        <div class="seat-pair">${restPair.map(s => renderSeat(vehicleName, s)).join('')}</div>
      </div>`;
    }
    if (row.length >= 4) {
      const firstPair = row.slice(0, 2);
      const restPair = row.slice(2);
      return `<div class="seat-row">
        <div class="seat-pair">${firstPair.map(s => renderSeat(vehicleName, s)).join('')}</div>
        <div class="aisle-gap"></div>
        <div class="seat-pair">${restPair.map(s => renderSeat(vehicleName, s)).join('')}</div>
      </div>`;
    }
    // ৪-এর কম হলে (একদম শেষ অসম্পূর্ণ সারি) সাধারণভাবে দেখানো
    return `<div class="seat-row"><div class="seat-pair">${row.map(s => renderSeat(vehicleName, s)).join('')}</div></div>`;
  }).join('');
}

function renderSeat(vehicleName, seat) {
  let cls = 'seat-available';
  if (seat.status === 'booked') cls = 'seat-booked';
  else if (seat.status === 'held') cls = 'seat-held';
  if (selectedSeats.some(s => s.vehicleName === vehicleName && s.seatNo === seat.seatNo)) cls = 'seat-selected';
  return `<div class="seat ${cls}" data-vehicle="${escapeHtml(vehicleName)}" data-seat="${escapeHtml(seat.seatNo)}">${escapeHtml(seat.seatNo)}</div>`;
}

function toggleSeat(vehicleName, seatNo) {
  const idx = selectedSeats.findIndex(s => s.vehicleName === vehicleName && s.seatNo === seatNo);
  if (idx >= 0) selectedSeats.splice(idx, 1);
  else selectedSeats.push({ vehicleName, seatNo });

  renderVehicles();
  qs('#seat-count').textContent = toBengaliNumber(selectedSeats.length);
  qs('#selected-seat-display').textContent = selectedSeats.length === 0
    ? 'বামপাশ থেকে সীট বেছে নিন'
    : selectedSeats.map(s => `${s.vehicleName}-${s.seatNo}`).join(', ');
  qs('#fee-display').value = formatTaka(totalFee());

  const btn = qs('#submit-btn');
  btn.disabled = selectedSeats.length === 0;
  btn.textContent = selectedSeats.length === 0 ? 'সীট নির্বাচন করুন' : `বুকিং তথ্য জমা দিন (${toBengaliNumber(selectedSeats.length)}টি সীট)`;
}

async function submitBooking(e) {
  e.preventDefault();
  if (selectedSeats.length === 0) { showToast('অনুগ্রহ করে অন্তত একটি সীট নির্বাচন করুন', 'error'); return; }

  const btn = qs('#submit-btn');
  btn.disabled = true;
  btn.textContent = 'সাবমিট হচ্ছে...';
  const fd = new FormData(e.target);
  const seats = selectedSeats.slice();

  try {
    const res = await apiPost('createBooking', {
      packageId: currentPackage.id,
      date: new Date().toISOString().split('T')[0],
      name: fd.get('name'),
      mobile: fd.get('mobile'),
      address: fd.get('address'),
      seats,
      delegateFee: currentPackage.delegateFee,
      paidAmount: 0, paymentMethod: '', transactionId: '', receivedBy: ''
    });

    if (!res.ok) {
      showToast(res.error || 'বুকিং ব্যর্থ হয়েছে', 'error');
      const seatRes = await apiGet('getSeats', { packageId: currentPackage.id }, { noCache: true });
      currentSeats = seatRes.ok ? seatRes.data : [];
      render();
      return;
    }
    try { localStorage.setItem(SAVED_MOBILE_KEY, fd.get('mobile')); } catch (err) {}
    showPaymentView({
      id: res.data.id, serial: res.data.serial, name: fd.get('name'), mobile: fd.get('mobile'),
      seats, delegateFee: res.data.totalFee, paidAmount: 0, dueAmount: res.data.totalFee, status: 'pending'
    }, true);
  } catch (err) {
    showToast('একটি ত্রুটি হয়েছে: ' + err.message, 'error');
    btn.disabled = false;
    btn.textContent = 'বুকিং তথ্য জমা দিন';
  }
}

// ============================================================
// পেমেন্টে ফিরে আসা (আগের বুকিং খুঁজে)
// ============================================================

function initResume() {
  let saved = '';
  try { saved = localStorage.getItem(SAVED_MOBILE_KEY) || ''; } catch (e) {}
  if (saved) {
    qs('#resume-form').mobile.value = saved;
    searchResume(saved, false);
  }
}

async function searchResume(mobile, manual) {
  const box = qs('#resume-results');
  box.innerHTML = '<div class="spinner" style="margin:14px auto;"></div>';
  try {
    const res = await apiGet('findMyBookings', { packageId: currentPackage.id, mobile }, { noCache: true });
    const list = res.ok ? res.data : [];
    if (list.length === 0) {
      box.innerHTML = manual ? '<div class="text-muted" style="margin-top:10px;">এই নম্বরে পেমেন্ট বাকি আছে এমন কোনো বুকিং পাওয়া যায়নি।</div>' : '';
      return;
    }
    box.innerHTML = list.map((b, i) => `
      <div class="resume-item">
        <div>ক্রম <strong>${toBengaliNumber(b.serial)}</strong> — ${escapeHtml((b.seats || []).map(s => s.vehicleName + '-' + s.seatNo).join(', '))}<br>
          <span class="text-muted">বকেয়া: <strong style="color:var(--red);">${formatTaka(b.dueAmount)}</strong></span></div>
        <button class="btn btn-primary btn-sm resume-pay-btn" data-i="${i}">💳 পেমেন্ট করুন</button>
      </div>`).join('');
    qsa('.resume-pay-btn', box).forEach(btn => btn.addEventListener('click', () => showPaymentView(list[Number(btn.dataset.i)], false)));
  } catch (err) {
    box.innerHTML = '<div class="text-muted" style="margin-top:10px;">খুঁজতে সমস্যা হয়েছে</div>';
  }
}

// ============================================================
// ধাপ ২: পেমেন্ট ফরম
// ============================================================

const MFS_APPS = [
  { keys: ['bkash', 'বিকাশ'], pkg: 'com.bKash.customerapp', scheme: 'bkash' },
  { keys: ['nagad', 'নগদ'], pkg: 'com.konasl.nagad', scheme: 'nagad' },
  { keys: ['rocket', 'রকেট'], pkg: 'com.dbbl.mbs.apps.main', scheme: 'rocket' },
  { keys: ['upay', 'উপায়'], pkg: 'com.fsiblbd.upay', scheme: 'upay' }
];

function openMfsApp(name) {
  const n = String(name || '').toLowerCase();
  const app = MFS_APPS.find(a => a.keys.some(k => n.includes(k)));
  if (!app) { showToast('এই মাধ্যমের অ্যাপ নিজে খুলে পেমেন্ট করুন', 'info'); return; }
  if (/android/i.test(navigator.userAgent)) {
    const fallback = encodeURIComponent('https://play.google.com/store/apps/details?id=' + app.pkg);
    location.href = `intent://open#Intent;scheme=${app.scheme};package=${app.pkg};S.browser_fallback_url=${fallback};end`;
  } else {
    location.href = app.scheme + '://';
  }
}

function copyText(text) {
  const done = () => showToast('কপি হয়েছে', 'success');
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => showToast(text, 'info'));
  else showToast(text, 'info');
}

function showPaymentView(b, justBooked) {
  window.scrollTo(0, 0);
  const due = Number(b.dueAmount) || 0;
  const seatText = (b.seats || []).map(s => s.vehicleName + '-' + s.seatNo).join(', ');
  const mobileList = payMethods.filter(m => m.kind === 'mobile');
  const bankList = payMethods.filter(m => m.kind === 'bank');

  qs('#page-content').innerHTML = `
    <div class="pay-wrap">
      <span class="eyebrow" style="background:var(--cream-dark); color:var(--forest); border-color:var(--border);">💳 পেমেন্ট</span>
      <h2 style="margin-top:0;">${escapeHtml(currentPackage.spotName)}</h2>
      ${justBooked ? `<div class="pay-info-box" style="border-style:solid;">✅ আপনার বুকিং তথ্য জমা হয়েছে এবং সীট আপনার নামে ধরে রাখা হয়েছে। এখন পেমেন্ট সম্পন্ন করুন। এখন না পারলে পরে এই পেজে <strong>"আগে বুকিং দিয়েছেন কিন্তু পেমেন্ট বাকি?"</strong> অংশে মোবাইল নম্বর দিয়ে ফিরে আসতে পারবেন।</div>` : ''}
      <div class="pay-summary">
        <div class="row"><span>ক্রম নং</span><span class="colon">:</span><strong>${toBengaliNumber(b.serial)}</strong></div>
        <div class="row"><span>নাম</span><span class="colon">:</span><strong>${escapeHtml(b.name)}</strong></div>
        <div class="row"><span>সীট</span><span class="colon">:</span><strong>${escapeHtml(seatText)}</strong></div>
        <div class="row"><span>মোট ফি</span><span class="colon">:</span><strong>${formatTaka(b.delegateFee)}</strong></div>
        <div class="row"><span>এ পর্যন্ত জমা</span><span class="colon">:</span><strong>${formatTaka(b.paidAmount)}</strong></div>
        <div class="row"><span>বকেয়া</span><span class="colon">:</span><strong style="color:var(--red);">${formatTaka(due)}</strong></div>
      </div>
      <div class="form-card">
        <form id="pay-form">
          <div class="form-group"><label>জমা দিচ্ছেন (টাকা) *</label><input type="number" id="pay-amount" min="1" max="${due}" value="${due}" required></div>
          <div class="form-group"><label>পেমেন্টের ধরণ *</label>
            <select id="pay-kind" required>
              <option value="">-- নির্বাচন করুন --</option>
              ${mobileList.length ? '<option value="mobile">📱 মোবাইল ব্যাংকিং</option>' : ''}
              ${bankList.length ? '<option value="bank">🏦 ব্যাংকিং</option>' : ''}
              <option value="cash">💵 হাতে হাতে / সরাসরি</option>
            </select>
          </div>
          <div id="pay-dynamic"></div>
          <button type="submit" class="btn btn-primary btn-block" id="pay-submit-btn" style="display:none;">পেমেন্ট তথ্য জমা দিন</button>
        </form>
      </div>
      <div style="margin-top:16px;"><a href="booking.html?pkg=${encodeURIComponent(pkgIdentifier)}" class="btn btn-outline-forest btn-sm">← বুকিং পেজে ফিরুন</a></div>
    </div>
  `;

  const dyn = qs('#pay-dynamic');
  const submitBtn = qs('#pay-submit-btn');

  qs('#pay-kind').addEventListener('change', async (e) => {
    const kind = e.target.value;
    submitBtn.style.display = kind ? '' : 'none';
    if (kind === 'mobile') {
      dyn.innerHTML = `
        <div class="form-group"><label>মাধ্যমের নাম *</label>
          <select id="pay-medium" required>
            <option value="">-- নির্বাচন করুন --</option>
            ${mobileList.map((m, i) => `<option value="${i}">${escapeHtml(m.name)}${m.mmType ? ' (' + escapeHtml(m.mmType) + ')' : ''}</option>`).join('')}
          </select>
        </div>
        <div id="pay-medium-info"></div>`;
      qs('#pay-medium').addEventListener('change', (ev) => {
        const m = mobileList[Number(ev.target.value)];
        const info = qs('#pay-medium-info');
        if (!m || ev.target.value === '') { info.innerHTML = ''; return; }
        info.innerHTML = `
          <div class="pay-info-box">
            <div><strong>${escapeHtml(m.name)}</strong>${m.mmType ? ' · ' + escapeHtml(m.mmType) : ''}</div>
            <div>এই নম্বরে টাকা পাঠান: <strong>${escapeHtml(m.number)}</strong> <button type="button" class="btn btn-sm btn-outline-forest" id="copy-num-btn">কপি</button></div>
            ${m.holder ? `<div>অ্যাকাউন্টধারী: ${escapeHtml(m.holder)}</div>` : ''}
            ${m.note ? `<div class="text-muted">নোট: ${escapeHtml(m.note)}</div>` : ''}
            <button type="button" class="btn btn-forest btn-sm" id="open-app-btn" style="margin-top:8px;">📲 ${escapeHtml(m.name)} অ্যাপ ওপেন করুন</button>
          </div>
          <div class="hint" style="margin-bottom:12px;">অ্যাপে পেমেন্ট সম্পন্ন করে নিচের তথ্য পূরণ করুন।</div>
          <div class="form-group"><label>যে মোবাইল নম্বর থেকে পাঠিয়েছেন *</label><input type="tel" id="pay-sender" required pattern="[0-9]{11}" placeholder="01XXXXXXXXX"></div>
          <div class="form-group"><label>ট্রানজেকশন আইডি *</label><input type="text" id="pay-txn" required placeholder="যেমন: 8N7A2X9K1M"></div>`;
        qs('#copy-num-btn').addEventListener('click', () => copyText(m.number));
        qs('#open-app-btn').addEventListener('click', () => openMfsApp(m.name));
      });
    } else if (kind === 'bank') {
      dyn.innerHTML = `
        <div class="form-group"><label>ব্যাংকের নাম *</label>
          <select id="pay-bank" required>
            <option value="">-- নির্বাচন করুন --</option>
            ${bankList.map((m, i) => `<option value="${i}">${escapeHtml(m.bankName)}</option>`).join('')}
          </select>
        </div>
        <div id="pay-bank-info"></div>`;
      qs('#pay-bank').addEventListener('change', (ev) => {
        const m = bankList[Number(ev.target.value)];
        const info = qs('#pay-bank-info');
        if (!m || ev.target.value === '') { info.innerHTML = ''; return; }
        info.innerHTML = `
          <div class="pay-info-box">
            <div><strong>${escapeHtml(m.bankName)}</strong>${m.branch ? ' · ' + escapeHtml(m.branch) : ''}</div>
            ${m.accountName ? `<div>একাউন্টের নাম: ${escapeHtml(m.accountName)}</div>` : ''}
            <div>একাউন্ট নং: <strong>${escapeHtml(m.accountNo)}</strong> <button type="button" class="btn btn-sm btn-outline-forest" id="copy-acc-btn">কপি</button></div>
          </div>
          <div class="hint" style="margin-bottom:12px;">উপরের একাউন্টে পেমেন্ট করে নিচের তথ্য পূরণ করুন।</div>
          <div class="form-group"><label>আপনার একাউন্ট নং (যেখান থেকে পাঠিয়েছেন) *</label><input type="text" id="pay-acc" required></div>
          <div class="form-group"><label>শাখা *</label><input type="text" id="pay-branch" required placeholder="আপনার ব্যাংকের শাখা"></div>`;
        qs('#copy-acc-btn').addEventListener('click', () => copyText(m.accountNo));
      });
    } else if (kind === 'cash') {
      dyn.innerHTML = `<div class="form-group"><label>কার কাছে টাকা জমা দিয়েছেন? *</label><select id="pay-received" required><option value="">লোড হচ্ছে...</option></select></div>`;
      try {
        if (!adminNames) { const r = await apiGet('getAdminNames'); adminNames = r.ok ? r.data : []; }
        qs('#pay-received').innerHTML = '<option value="">-- নির্বাচন করুন --</option>' + adminNames.map(a => `<option value="${escapeHtml(a.name)}">${escapeHtml(a.name)}</option>`).join('');
      } catch (err) { qs('#pay-received').innerHTML = '<option value="">লোড করা যায়নি</option>'; }
    } else {
      dyn.innerHTML = '';
    }
  });

  qs('#pay-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const kind = qs('#pay-kind').value;
    const amount = Number(qs('#pay-amount').value) || 0;
    if (!kind) { showToast('পেমেন্টের ধরণ নির্বাচন করুন', 'error'); return; }
    if (amount < 1 || amount > due) { showToast('জমার পরিমাণ ১ থেকে ' + due + ' টাকার মধ্যে দিন', 'error'); return; }

    const payload = { bookingId: b.id, mobile: b.mobile, amount, kind, details: {} };
    if (kind === 'mobile') {
      const m = mobileList[Number(qs('#pay-medium').value)];
      const sender = qs('#pay-sender') && qs('#pay-sender').value.trim();
      const txn = qs('#pay-txn') && qs('#pay-txn').value.trim();
      if (!m) { showToast('মাধ্যমের নাম নির্বাচন করুন', 'error'); return; }
      if (!sender || !txn) { showToast('মোবাইল নম্বর ও ট্রানজেকশন আইডি দুটোই দিতে হবে', 'error'); return; }
      payload.mediumName = m.name;
      payload.details = { senderMobile: sender, transactionId: txn, toNumber: m.number, mmType: m.mmType || '' };
    } else if (kind === 'bank') {
      const m = bankList[Number(qs('#pay-bank').value)];
      const acc = qs('#pay-acc') && qs('#pay-acc').value.trim();
      const br = qs('#pay-branch') && qs('#pay-branch').value.trim();
      if (!m) { showToast('ব্যাংকের নাম নির্বাচন করুন', 'error'); return; }
      if (!acc || !br) { showToast('একাউন্ট নং ও শাখা দুটোই দিতে হবে', 'error'); return; }
      payload.mediumName = m.bankName;
      payload.details = { accountNo: acc, branch: br, toAccountNo: m.accountNo };
    } else {
      payload.receivedBy = qs('#pay-received').value;
      if (!payload.receivedBy) { showToast('কার কাছে টাকা জমা দিয়েছেন তা নির্বাচন করুন', 'error'); return; }
    }

    submitBtn.disabled = true; submitBtn.textContent = 'জমা হচ্ছে...';
    try {
      const res = await apiPost('submitPayment', payload);
      if (!res.ok) throw new Error(res.error || 'ব্যর্থ হয়েছে');
      qs('#page-content').innerHTML = `
        <div class="empty-state">
          <div style="font-size:3rem;">✅</div>
          <h2>পেমেন্ট তথ্য জমা হয়েছে!</h2>
          <p>ক্রম নং <strong>${toBengaliNumber(b.serial)}</strong> — এ পর্যন্ত জমা: <strong>${formatTaka(res.data.paidAmount)}</strong> · বকেয়া: <strong>${formatTaka(res.data.dueAmount)}</strong></p>
          <p class="text-muted">এডমিন যাচাই করে আপনার বুকিং কনফার্ম করবেন। কনফার্ম হওয়ার পর <a href="ticket.html">টিকেট পেজ</a> থেকে নাম ও মোবাইল দিয়ে টিকেট বের করতে পারবেন।</p>
          ${Number(res.data.dueAmount) > 0 ? '<p class="text-muted">বাকি টাকা পরে এই বুকিং পেজে মোবাইল নম্বর দিয়ে খুঁজে পরিশোধ করতে পারবেন।</p>' : ''}
          <a href="index.html" class="btn btn-forest" style="margin-top:16px;">অন্যান্য প্যাকেজ দেখুন</a>
        </div>`;
    } catch (err) {
      showToast('ত্রুটি: ' + err.message, 'error');
      submitBtn.disabled = false; submitBtn.textContent = 'পেমেন্ট তথ্য জমা দিন';
    }
  });
}

init();
</script>
</body>
</html>
